server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
